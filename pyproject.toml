[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "padufes-multimodal"
version = "0.1.0"
description = "Simple image + metadata baseline for PAD-UFES-20"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "Pillow>=10.0",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "torchvision>=0.17",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
